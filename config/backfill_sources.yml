# 과거 시계열 backfill — 계층형 검증(verification_status).
# verified: 직접 기사/공식 URL + evidence_text + published_at (source_url 필수)
# corroborated: 직접 URL 미확보, 복수 매체/회사 인용 교차확인 (source_note+evidence_note 필수, source_url null)
# provisional: 이미지/메모로 숫자 확인, 원문 URL 미확인 (source_url null 허용, source_note+evidence_note 필수)
#   → 외부추정선에만 표시('원문 미확인'). 공식선 절대 미포함.
# needs_review: 불명확 → 공개 JSON 제외.
# ※ URL 없다고 publisher 홈 주소를 source_url 에 넣지 않음. 임의 문장을 evidence_text 로 저장하지 않음(→ evidence_note).

